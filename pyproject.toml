[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-music"
version = "0.1.0"
description = "Evidence-linked music maps and transition experiments for agents and listeners."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1", "typing_extensions>=4.9,<5"]

[project.optional-dependencies]
agent = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
pocket = "pocket_music.cli:main"
pocket-mcp = "pocket_music.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
