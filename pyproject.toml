[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-music"
version = "0.4.0"
description = "The musical toolkit for agents: record selection, evidence-linked maps and transition experiments."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1", "typing_extensions>=4.9,<5"]

[project.optional-dependencies]
midi = ["mido>=1.3,<2"]
agent = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
pocket = "pocket_music.cli:main"
pocket-mcp = "pocket_music.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.setuptools.package-data]
pocket_music = ["basic_pitch_LICENSE.txt", "web/*.html", "web/*.css", "web/*.js", "web/*.svg", "devices/baste/*.js", "devices/baste/*.maxpat", "devices/native_midi/*.js", "devices/native_midi/*.maxpat", "devices/native_midi_writer/*.js", "devices/native_midi_writer/*.maxpat"]
