# Contributor license agreement check. OFF until the maintainer approves CLA.md.
#
# While the repository variable POCKET_CLA_ENABLED is unset, the job below is
# skipped: nothing runs, no token is used and no pull request is blocked.
#
# To turn it on, after CLA.md has passed legal review and lost its DRAFT banner:
#   1. Create an unprotected branch named cla-signatures for the signature
#      file (main is protected, so the bot can't commit there).
#   2. Set the repository variable POCKET_CLA_ENABLED to true
#      (Settings > Secrets and variables > Actions > Variables).
#   3. Optional, to make it blocking: add the "CLA" check to the required status
#      checks of main's branch protection. Until then it only reports.
#
# contributor-assistant/github-action is archived and no longer maintained;
# it's pinned to the last release's commit. Check that it still runs on
# GitHub's current Node runtime before enabling, or switch to a maintained
# alternative.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  contents: read
jobs:
  cla:
    if: >-
      vars.POCKET_CLA_ENABLED == 'true' && (
        github.event_name == 'pull_request_target' || (
          github.event.issue.pull_request && (
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the Pocket Contributor License Agreement and I hereby sign it.')))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # Runs only the pinned action; it never checks out or executes pull request code.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/rpalermodrums/pocket/blob/main/CLA.md
          path-to-signatures: signatures/cla-v1.json
          branch: cla-signatures
          allowlist: rpalermodrums,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Pocket Contributor License Agreement and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thanks for contributing to Pocket! Before we can merge this, please read the
            [contributor license agreement](https://github.com/rpalermodrums/pocket/blob/main/CLA.md)
            and sign it by posting the comment below. You keep the copyright in your work;
            [Contributing](https://github.com/rpalermodrums/pocket/blob/main/CONTRIBUTING.md#contributor-license-agreement)
            explains why Pocket asks.
          custom-allsigned-prcomment: Everyone on this pull request has signed the Pocket contributor license agreement. Thank you!
