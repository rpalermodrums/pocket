name: Publish website
on:
  # Each main commit publishes itself once its Tests push run passes.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  # Manual re-publish of main, or rollback to a reviewed main-history SHA.
  workflow_dispatch:
    inputs:
      revision:
        description: 'main, or a full previously reviewed main-history SHA for rollback'
        required: true
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    # A workflow_run's github.sha is the main tip when the run was created, so
    # a commit already superseded when its Tests finished is skipped rather
    # than published over the newer one. A commit landing later publishes
    # after this run (the concurrency group keeps order). Pull request runs,
    # including fork branches named main, never match.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require verified main history
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.revision }}
        run: |
          verified_sha="$(python site/scripts/check_publish.py)"
          printf '%s\n' "sha=$verified_sha" >> "$GITHUB_OUTPUT"
      - name: Select verified source
        env:
          PUBLISH_SHA: ${{ steps.revision.outputs.sha }}
        run: git checkout --detach "$PUBLISH_SHA"
      - run: python -m pip install -e '.[agent,dev,midi]' -r requirements-docs.txt
      - run: python -m pytest -q tests/test_public_site.py
      - run: python site/build.py --output private/site-build/publish
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: private/site-build/publish/pocket/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
