name: Public docs
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[agent,dev,midi]' -r requirements-docs.txt
      - run: python -m pytest -q tests/test_public_site.py
      - run: python examples/practice_context.py private/onboarding
      - run: pocket context-resolve --spec private/onboarding/resolve-spec.json
      - run: python site/build.py --output private/site-build/ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-preview
          path: private/site-build/ci/pocket/
          retention-days: 7
          if-no-files-found: error
